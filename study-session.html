<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Session</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d1e;overflow:hidden}
  svg{display:block;width:100vw;height:100vh;cursor:pointer}
  svg *{transform-box:view-box}

  /* head bobbing to the music */
  .nod{transform-origin:568px 240px;animation:nod .9s ease-in-out infinite alternate}
  @keyframes nod{from{transform:rotate(-1deg)}to{transform:rotate(3.5deg)}}

  /* breathing */
  .breathe{transform-origin:555px 362px;animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}

  /* blinking */
  .blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

  /* typing arms */
  .typeA{transform-origin:600px 320px;animation:typeA .22s ease-in-out infinite alternate}
  .typeB{transform-origin:612px 316px;animation:typeA .26s ease-in-out infinite alternate-reverse}
  @keyframes typeA{from{transform:rotate(0)}to{transform:rotate(-1.6deg)}}

  /* scrolling code */
  .code{animation:scroll 14s linear infinite}
  @keyframes scroll{to{transform:translateY(-171px)}}
  .cursor{animation:cur 1s steps(1) infinite}
  @keyframes cur{50%{opacity:0}}

  .glow{animation:glow 4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.9}50%{opacity:1}43%{opacity:.75}}

  .rgb{animation:rgb 6s linear infinite}
  @keyframes rgb{to{filter:hue-rotate(360deg)}}

  /* mug steam */
  .steam{animation:steam 3.2s ease-in-out infinite;opacity:0}
  .steam:nth-child(2){animation-delay:1s}
  .steam:nth-child(3){animation-delay:2.1s}
  @keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.45}100%{transform:translateY(-34px);opacity:0}}

  /* music notes floating from the headphones */
  .note{opacity:0;animation:note 4.2s ease-out infinite}
  .note:nth-child(2){animation-delay:1.4s}
  .note:nth-child(3){animation-delay:2.8s}
  @keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(-46px,-80px);opacity:0}}

  .sway{transform-origin:930px 108px;animation:sway 5s ease-in-out infinite alternate}
  .sway2{transform-origin:968px 108px;animation:sway 6s ease-in-out infinite alternate-reverse}
  @keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

  .twinkle{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

  .cloud{animation:cloud 60s linear infinite}
  @keyframes cloud{from{transform:translateX(-160px)}to{transform:translateX(420px)}}

  .shoot{opacity:0;animation:shoot 11s ease-in infinite 3s}
  @keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}7%{transform:translate(-170px,90px);opacity:0}100%{opacity:0}}

  .firefly{animation:ff 7s ease-in-out infinite alternate}
  @keyframes ff{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(18px,-14px);opacity:.3}}

  .paused *{animation-play-state:paused!important}
  @media (prefers-reduced-motion: reduce){svg *{animation-play-state:paused!important}}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Animated scene: a teen boy with glowing headphones codes at his desk late at night beside a window with mountains and stars. Click to pause.">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0f24"/><stop offset="1" stop-color="#151233"/>
    </linearGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050821"/><stop offset=".7" stop-color="#1b1748"/><stop offset="1" stop-color="#3a1f55"/>
    </linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampGlow"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
    <radialGradient id="screenGlow"><stop offset="0" stop-color="#00e5ff" stop-opacity=".22"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd88a" stop-opacity=".28"/><stop offset="1" stop-color="#ffd88a" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d0b24"/><stop offset="1" stop-color="#4a0614"/>
    </linearGradient>
    <linearGradient id="rgbLine" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2bd6"/><stop offset=".33" stop-color="#00e5ff"/><stop offset=".66" stop-color="#39ff88"/><stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="win"><rect x="110" y="70" width="300" height="230"/></clipPath>
    <clipPath id="screen"><rect x="780" y="180" width="210" height="130"/></clipPath>
  </defs>

  <!-- room -->
  <rect width="1200" height="500" fill="url(#wall)"/>
  <rect y="440" width="1200" height="60" fill="#0a0916"/>
  <g id="lights"></g>

  <!-- window -->
  <g clip-path="url(#win)">
    <rect x="110" y="70" width="300" height="230" fill="url(#nightSky)"/>
    <g id="stars"></g>
    <circle cx="335" cy="120" r="60" fill="url(#moonGlow)"/>
    <circle cx="335" cy="120" r="20" fill="#fff3cf"/>
    <circle cx="328" cy="115" r="4" fill="#efe1b8"/><circle cx="342" cy="126" r="3" fill="#efe1b8"/>
    <g class="cloud" opacity=".35"><ellipse cx="120" cy="150" rx="46" ry="10" fill="#8f86c9"/><ellipse cx="140" cy="143" rx="26" ry="9" fill="#8f86c9"/></g>
    <line class="shoot" x1="380" y1="85" x2="400" y2="74" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <polygon points="110,300 110,215 170,165 220,200 270,150 330,205 370,180 410,210 410,300" fill="#241d4a"/>
    <polygon points="110,300 110,245 160,225 215,250 265,228 320,255 410,235 410,300" fill="#17133a"/>
    <g fill="#0d0b25" id="pines"></g>
    <circle class="firefly" cx="180" cy="262" r="2" fill="#d6ff7a" filter="url(#neon)"/>
    <circle class="firefly" cx="300" cy="270" r="1.8" fill="#d6ff7a" filter="url(#neon)" style="animation-delay:-3s"/>
  </g>
  <rect x="104" y="64" width="312" height="242" rx="4" fill="none" stroke="#2c2547" stroke-width="12"/>
  <line x1="260" y1="70" x2="260" y2="300" stroke="#2c2547" stroke-width="6"/>
  <line x1="110" y1="185" x2="410" y2="185" stroke="#2c2547" stroke-width="6"/>
  <rect x="96" y="304" width="328" height="12" rx="3" fill="#2c2547"/>
  <path d="M86,56 C96,140 84,240 98,330 L70,330 L70,56 Z" fill="#3b2a5a" opacity=".85"/>

  <!-- poster -->
  <rect x="632" y="52" width="112" height="104" rx="3" fill="#1a1433" stroke="#3a2e5c" stroke-width="3"/>
  <circle cx="688" cy="92" r="26" fill="#d4313f"/>
  <polygon points="636,152 668,112 688,130 710,104 740,152" fill="#0e0b22"/>
  <text x="726" y="78" fill="#ffd166" font-size="14" font-family="sans-serif" font-weight="700">夢</text>
  <text x="726" y="96" fill="#ffd166" font-size="14" font-family="sans-serif" font-weight="700">道</text>

  <!-- shelf with plant and books -->
  <rect x="880" y="104" width="270" height="8" rx="2" fill="#3a2e4f"/>
  <path d="M916,104 L944,104 L940,84 L920,84 Z" fill="#c76b3e"/>
  <g class="sway"><path d="M930,108 C925,140 918,160 922,190" stroke="#2f8a4f" stroke-width="2" fill="none"/>
    <ellipse cx="924" cy="140" rx="7" ry="4" fill="#3fae64" transform="rotate(-30 924 140)"/><ellipse cx="919" cy="165" rx="7" ry="4" fill="#3fae64" transform="rotate(25 919 165)"/><ellipse cx="922" cy="190" rx="6" ry="4" fill="#4cc474"/></g>
  <g class="sway2"><path d="M936,108 C944,130 950,148 946,170" stroke="#2f8a4f" stroke-width="2" fill="none"/>
    <ellipse cx="947" cy="135" rx="7" ry="4" fill="#3fae64" transform="rotate(30 947 135)"/><ellipse cx="946" cy="170" rx="6" ry="4" fill="#4cc474"/></g>
  <ellipse cx="922" cy="80" rx="12" ry="6" fill="#3fae64"/><ellipse cx="938" cy="78" rx="10" ry="6" fill="#4cc474"/>
  <rect x="990" y="66" width="12" height="38" fill="#00a7c2"/><rect x="1004" y="72" width="10" height="32" fill="#ffb000"/>
  <rect x="1016" y="62" width="14" height="42" fill="#7c4dff"/><rect x="1032" y="76" width="12" height="28" fill="#d4313f" transform="rotate(12 1038 104)"/>
  <rect x="1080" y="84" width="40" height="20" rx="3" fill="#1d1b2e"/><circle cx="1100" cy="94" r="5" fill="#39ff88" filter="url(#neon)" class="twinkle"/>

  <!-- lamp light -->
  <circle cx="1080" cy="300" r="170" fill="url(#lampGlow)"/>
  <polygon points="1066,262 1100,262 1160,356 990,356" fill="url(#cone)"/>

  <!-- chair back -->
  <rect x="456" y="188" width="64" height="182" rx="24" fill="#1d1b2e"/>
  <rect x="470" y="200" width="10" height="160" rx="5" fill="#8d0b24" opacity=".8"/>
  <rect x="464" y="362" width="128" height="16" rx="7" fill="#24213a"/>
  <rect x="522" y="378" width="9" height="56" fill="#24213a"/>
  <path d="M480,442 L575,442" stroke="#24213a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="484" cy="448" r="6" fill="#1a182a"/><circle cx="572" cy="448" r="6" fill="#1a182a"/>

  <!-- legs -->
  <path d="M548,372 L646,380" stroke="#262a40" stroke-width="28" stroke-linecap="round"/>
  <path d="M646,380 L650,438" stroke="#262a40" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="664" cy="444" rx="22" ry="8" fill="#e8e8f0"/><rect x="644" y="443" width="40" height="4" fill="#00e5ff"/>

  <!-- desk -->
  <rect x="602" y="356" width="584" height="14" rx="2" fill="#3a2e4f"/>
  <rect x="602" y="370" width="584" height="12" fill="#241c33"/>
  <rect x="618" y="382" width="12" height="62" fill="#241c33"/><rect x="1160" y="382" width="12" height="62" fill="#241c33"/>

  <!-- monitor -->
  <ellipse cx="885" cy="300" rx="190" ry="120" fill="url(#screenGlow)" class="glow"/>
  <rect x="872" y="322" width="26" height="30" fill="#1c1f2e"/><rect x="842" y="350" width="86" height="7" rx="3" fill="#1c1f2e"/>
  <rect x="770" y="170" width="230" height="150" rx="8" fill="#0b0d16" stroke="#2b2f45" stroke-width="3"/>
  <rect x="780" y="180" width="210" height="130" fill="#08101f"/>
  <g clip-path="url(#screen)"><g class="code" id="code"></g></g>
  <rect class="cursor" x="836" y="296" width="6" height="8" fill="#00e5ff"/>
  <rect x="780" y="180" width="210" height="130" fill="#00e5ff" fill-opacity=".04" class="glow"/>

  <!-- keyboard -->
  <rect x="636" y="347" width="120" height="9" rx="3" fill="#1b1d2b"/>
  <rect class="rgb" x="638" y="354" width="116" height="2.5" rx="1" fill="url(#rgbLine)" filter="url(#neon)"/>

  <!-- desk items -->
  <g transform="translate(1020 324)">
    <g fill="none" stroke="#cfd3ff" stroke-width="2" stroke-linecap="round" opacity=".7">
      <path class="steam" d="M6,-4 C2,-10 10,-14 6,-20"/>
      <path class="steam" d="M13,-4 C9,-10 17,-14 13,-20"/>
      <path class="steam" d="M20,-4 C16,-10 24,-14 20,-20"/>
    </g>
    <rect x="0" y="0" width="26" height="32" rx="4" fill="#2a8c9c"/>
    <path d="M26,8 C36,8 36,24 26,24" stroke="#2a8c9c" stroke-width="4" fill="none"/>
    <text x="6" y="22" font-size="11" fill="#e8fbff" font-family="monospace">{}</text>
  </g>
  <rect x="1062" y="340" width="56" height="8" fill="#7c4dff"/><rect x="1066" y="332" width="50" height="8" fill="#d4313f"/><rect x="1060" y="324" width="58" height="8" fill="#ffb000"/>
  <!-- lamp -->
  <ellipse cx="1150" cy="354" rx="22" ry="5" fill="#1d1b2e"/>
  <path d="M1150,352 L1136,300 L1096,262" stroke="#2e2a45" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M1064,264 L1104,264 L1094,244 L1076,244 Z" fill="#2e2a45"/>
  <ellipse cx="1084" cy="265" rx="18" ry="3" fill="#fff0c4" filter="url(#neon)"/>

  <!-- the coder -->
  <path d="M700,350 L710,349" stroke="#f2c7a6" stroke-width="12" stroke-linecap="round" opacity=".7"/>
  <g class="typeB" opacity=".75">
    <path d="M590,268 L612,316 L690,344" stroke="#5a0717" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="698" cy="346" r="8" fill="#e0b494"/>
  </g>

  <g class="breathe">
    <path d="M534,252 C548,236 576,238 592,252 C606,282 608,330 602,366 L516,366 C508,320 512,276 534,252 Z" fill="url(#hoodie)"/>
    <path d="M532,256 C520,246 524,226 548,232 C556,240 548,256 532,256 Z" fill="#6d071a"/>
    <path d="M582,256 L586,292 M590,254 L596,288" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <text x="545" y="320" font-size="13" fill="#d4af37" font-family="monospace" opacity=".8">&lt;/&gt;</text>
  </g>

  <g class="nod">
    <rect x="558" y="226" width="20" height="22" rx="6" fill="#e6b896"/>
    <ellipse cx="580" cy="205" rx="30" ry="33" fill="#f2c7a6"/>
    <path d="M606,204 L615,216 L606,219 Z" fill="#f2c7a6"/>
    <path d="M598,234 C590,240 576,240 566,232 L568,226 L600,228 Z" fill="#e6b896"/>
    <path d="M601,226 L608,225" stroke="#9c5a4a" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse class="blink" cx="599" cy="203" rx="2.6" ry="3.8" fill="#1b1530"/>
    <path d="M593,193 L605,191" stroke="#1a1530" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="604" cy="213" rx="5" ry="2.5" fill="#ff9aa8" opacity=".35"/>
    <path d="M546,224 C538,190 552,166 580,167 C602,168 614,180 616,197 L606,190 L608,204 L598,192 L595,205 L588,190 C580,197 570,196 562,190 C558,202 557,214 558,228 Z" fill="#1c1733"/>
    <path d="M552,182 L540,166 L560,170 L560,150 L576,166 L586,146 L592,166 L610,156 L604,176 Z" fill="#1c1733"/>
    <path d="M574,162 C584,158 596,160 604,168" stroke="#3a3366" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M566,196 C560,166 580,150 598,158" stroke="#181826" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M566,196 C560,166 580,150 598,158" stroke="#00e5ff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="566" cy="210" rx="14" ry="18" fill="#15151f"/>
    <ellipse cx="566" cy="210" rx="14" ry="18" fill="none" stroke="#00e5ff" stroke-width="2.2" filter="url(#neon)" class="glow"/>
    <circle cx="566" cy="210" r="3" fill="#ff2bd6" filter="url(#neon)"/>
  </g>

  <g class="typeA">
    <path d="M572,262 L600,320 L674,348" stroke="url(#hoodie)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="682" cy="348" r="9" fill="#f2c7a6"/>
  </g>

  <!-- music notes -->
  <g fill="#ff2bd6" font-size="18" font-family="sans-serif" filter="url(#neon)">
    <text class="note" x="548" y="182">♪</text>
    <text class="note" x="540" y="190" fill="#00e5ff">♫</text>
    <text class="note" x="552" y="186" fill="#ffd166">♪</text>
  </g>
</svg>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const rand = (a, b) => a + Math.random() * (b - a);

  // code lines (two identical blocks so the scroll loops seamlessly)
  const code = document.getElementById('code');
  const colors = ['#ff6ad5', '#00e5ff', '#ffd166', '#39ff88', '#a9b4d6', '#7c4dff'];
  const lines = [];
  let indent = 0;
  for (let i = 0; i < 19; i++) {
    if (Math.random() < .25 && indent < 3) indent++;
    else if (Math.random() < .25 && indent > 0) indent--;
    const segs = [];
    let x = 790 + indent * 12;
    const n = 1 + Math.floor(Math.random() * 3);
    for (let s = 0; s < n && x < 970; s++) {
      const w = Math.min(rand(14, 52), 980 - x);
      segs.push([x, w, colors[Math.floor(Math.random() * colors.length)]]);
      x += w + 5;
    }
    lines.push(segs);
  }
  for (let copy = 0; copy < 2; copy++) {
    lines.forEach((segs, i) => {
      const y = 188 + copy * 171 + i * 9;
      el('text', { x: 783, y: y + 4.5, 'font-size': 5, fill: '#3b4568', 'font-family': 'monospace' }, code).textContent = i + 1;
      segs.forEach(([x, w, c]) => el('rect', { x, y, width: w, height: 4, rx: 1.5, fill: c, opacity: .85 }, code));
    });
  }

  // stars in the window
  const stars = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = el('circle', { cx: rand(112, 408), cy: rand(72, 200), r: rand(.6, 1.6), fill: '#fff', class: 'twinkle' }, stars);
    s.style.animationDelay = `${-rand(0, 3)}s`;
    s.style.animationDuration = `${rand(2, 4.5)}s`;
  }

  // pine tree line
  const pines = document.getElementById('pines');
  for (let x = 104; x < 420; x += rand(12, 22)) {
    const h = rand(26, 52), w = h * .42, base = 300;
    el('polygon', { points: `${x},${base - h} ${x - w},${base} ${x + w},${base}` }, pines);
  }

  // fairy lights along the ceiling
  const lights = document.getElementById('lights');
  el('path', { d: 'M40,24 Q320,58 600,26 Q880,58 1160,24', stroke: '#2b2440', 'stroke-width': 1.5, fill: 'none' }, lights);
  const bulbs = ['#ffcf7a', '#ff9ad8', '#8ff7ff'];
  for (let i = 0; i <= 28; i++) {
    const tt = i / 28, half = tt < .5;
    const u = half ? tt * 2 : (tt - .5) * 2;
    const x0 = half ? 40 : 600, x2 = half ? 600 : 1160, cx = half ? 320 : 880;
    const x = (1 - u) ** 2 * x0 + 2 * (1 - u) * u * cx + u * u * x2;
    const y = (1 - u) ** 2 * 24 + 2 * (1 - u) * u * 58 + u * u * (half ? 26 : 24) + 4;
    const b = el('circle', { cx: x, cy: y, r: 3, fill: bulbs[i % 3], filter: 'url(#neon)', class: 'twinkle' }, lights);
    b.style.animationDelay = `${-rand(0, 3)}s`;
  }

  // click to pause / resume
  const svg = document.getElementById('scene');
  svg.addEventListener('click', () => svg.classList.toggle('paused'));
})();
</script>
</body>
</html>
