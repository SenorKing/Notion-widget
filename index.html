<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Drive</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" aria-label="Animated scene: a car driving through a rainy neon city at night. Click to pause."></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  const NEON = ['#00e5ff', '#ff2bd6', '#ffb000', '#7c4dff', '#39ff88'];
  const SIGNS = ['ラーメン', '夜', '東京', '24H', '電', 'バー', '未来', 'カフェ', '雨'];

  let W, H, DPR, roadY, carGround, laneY, L, carX, ROAD;
  let far, near, drops = [], splashes = [];
  let t = 0, flash = 0, nextFlash = rand(8, 16);
  let running = !matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- city layers (pre-rendered once) ----------
  function makeLayer(o) {
    const lw = Math.ceil(W * 1.6);
    const c = document.createElement('canvas');
    c.width = lw * DPR; c.height = Math.ceil(roadY * DPR);
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    let bx = 0;
    while (bx < lw) {
      if (lw - bx < o.minW) break;
      const bw = Math.min(rand(o.minW, o.maxW), lw - bx);
      const bh = rand(o.minH, o.maxH) * roadY;
      const top = roadY - bh;
      g.fillStyle = o.color;
      g.fillRect(bx, top, bw, bh);
      if (Math.random() < .25) g.fillRect(bx + bw / 2 - 1, top - rand(10, 40), 2, 40); // antenna

      const ws = o.win, gap = ws * 1.9;
      for (let wy = top + ws * 1.5; wy < roadY - ws * 2; wy += gap) {
        for (let wx = bx + ws; wx < bx + bw - ws * 1.5; wx += gap) {
          if (Math.random() < o.lit) {
            g.fillStyle = Math.random() < .8
              ? `rgba(255,214,140,${rand(.25, .7)})`
              : `rgba(120,220,255,${rand(.3, .7)})`;
            g.fillRect(wx, wy, ws, ws * 1.2);
          }
        }
      }

      if (o.signs && bw > 40 && Math.random() < .45) {
        const col = pick(NEON), txt = pick(SIGNS);
        const fs = Math.max(11, Math.min(22, bw * .28));
        const sx = bx + bw * rand(.3, .7), sy = top + rand(.12, .4) * bh;
        g.save();
        g.font = `700 ${fs}px "Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif`;
        g.textAlign = 'center';
        g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 14;
        if (Math.random() < .6) [...txt].forEach((ch, i) => g.fillText(ch, sx, sy + i * fs * 1.05));
        else g.fillText(txt, sx, sy);
        g.restore();
      }
      bx += bw + rand(0, o.gap);
    }
    return { c, w: lw };
  }

  function drawLayer(layer, offset) {
    const o = offset % layer.w;
    ctx.drawImage(layer.c, -o, 0, layer.w, roadY);
    ctx.drawImage(layer.c, layer.w - o, 0, layer.w, roadY);
  }

  // ---------- rain ----------
  function newDrop(d, anywhere) {
    d.near = Math.random() < .35;
    d.l = d.near ? rand(18, 30) : rand(9, 16);
    d.v = d.near ? rand(900, 1200) : rand(600, 800);
    d.x = rand(0, W * 1.3);
    d.y = anywhere ? rand(-H * .2, H) : rand(-H * .25, 0);
    d.ty = Math.random() < .55 ? rand(roadY + 6, H) : H + 40;
    return d;
  }

  function setup() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    roadY = H * .7;
    carGround = roadY + (H - roadY) * .55;
    laneY = roadY + (H - roadY) * .85;
    L = Math.max(160, Math.min(W * .28, H * 1.3, 480));
    carX = W * .3;
    ROAD = Math.max(380, W * .6);

    far = makeLayer({ minW: 40, maxW: 110, minH: .25, maxH: .6, gap: 6, win: 3, lit: .18, color: '#0d1026', signs: false });
    near = makeLayer({ minW: 50, maxW: 140, minH: .3, maxH: .85, gap: 14, win: 4, lit: .22, color: '#06070f', signs: true });

    const n = Math.min(900, Math.round(W * H / 2400));
    drops = Array.from({ length: n }, () => newDrop({}, true));
    splashes = [];
  }

  // ---------- scene pieces ----------
  function sky() {
    const g = ctx.createLinearGradient(0, 0, 0, roadY);
    g.addColorStop(0, '#04050d');
    g.addColorStop(.6, '#0e0b26');
    g.addColorStop(1, '#2a0f3a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, roadY);
    const glow = ctx.createRadialGradient(W * .7, roadY, 0, W * .7, roadY, W * .7);
    glow.addColorStop(0, 'rgba(255,43,214,.18)');
    glow.addColorStop(1, 'rgba(255,43,214,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, roadY);
  }

  function fog(y0, y1, a) {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, 'rgba(60,40,110,0)');
    g.addColorStop(1, `rgba(60,40,110,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0);
  }

  function streetlights(pool) {
    const sp = 340, off = (t * ROAD * .8) % sp;
    const postH = roadY * .42;
    for (let x = -off; x < W + sp; x += sp) {
      const lx = x + 26, ly = roadY - postH;
      if (!pool) {
        ctx.fillStyle = '#10121c';
        ctx.fillRect(x, ly, 3, postH);
        ctx.fillRect(x, ly, 30, 3);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(lx, ly + 4, 0, lx, ly + 4, 46);
        g.addColorStop(0, 'rgba(255,200,120,.9)');
        g.addColorStop(.15, 'rgba(255,170,90,.35)');
        g.addColorStop(1, 'rgba(255,170,90,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(lx, ly + 4, 46, 0, Math.PI * 2); ctx.fill();
        // light cone
        const cg = ctx.createLinearGradient(0, ly, 0, roadY);
        cg.addColorStop(0, 'rgba(255,190,110,.12)');
        cg.addColorStop(1, 'rgba(255,190,110,.03)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.moveTo(lx - 6, ly + 6); ctx.lineTo(lx + 6, ly + 6);
        ctx.lineTo(lx + 70, roadY); ctx.lineTo(lx - 70, roadY);
        ctx.fill();
        ctx.restore();
      } else {
        // reflection pool on wet road
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(lx, roadY + 14, 0, lx, roadY + 14, 120);
        g.addColorStop(0, 'rgba(255,180,100,.22)');
        g.addColorStop(1, 'rgba(255,180,100,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(lx, roadY + 14, 120, 26, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
  }

  function road() {
    ctx.fillStyle = '#0a0b12';
    ctx.fillRect(0, roadY, W, H - roadY);

    // wet reflection of the city
    ctx.save();
    ctx.translate(0, roadY * 2);
    ctx.scale(1, -1);
    ctx.globalAlpha = .28;
    drawLayer(near, t * 45);
    ctx.restore();

    const g = ctx.createLinearGradient(0, roadY, 0, H);
    g.addColorStop(0, 'rgba(8,9,16,.35)');
    g.addColorStop(1, 'rgba(8,9,16,.85)');
    ctx.fillStyle = g; ctx.fillRect(0, roadY, W, H - roadY);

    ctx.fillStyle = '#1a1c2a';
    ctx.fillRect(0, roadY, W, 5);

    streetlights(true);

    // lane dashes
    const per = 150, len = 70, off = (t * ROAD) % per;
    ctx.fillStyle = 'rgba(225,228,240,.55)';
    for (let x = -off; x < W + per; x += per) ctx.fillRect(x, laneY, len, 3);
  }

  function car() {
    const s = L / 100;
    const bob = Math.sin(t * 9) * .25 + Math.sin(t * 23) * .08;
    ctx.save();
    ctx.translate(carX, carGround + bob * s);
    ctx.scale(s, s);

    // headlight beam + reflections
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createLinearGradient(98, 0, 330, 0);
    beam.addColorStop(0, 'rgba(210,235,255,.45)');
    beam.addColorStop(1, 'rgba(210,235,255,0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(98, -19); ctx.lineTo(330, -26); ctx.lineTo(330, 10); ctx.lineTo(98, -13);
    ctx.fill();
    ctx.fillStyle = 'rgba(210,235,255,.18)';
    ctx.beginPath(); ctx.ellipse(150, 3, 60, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,40,70,.25)';
    ctx.beginPath(); ctx.ellipse(-6, 3, 16, 1.8, 0, 0, Math.PI * 2); ctx.fill();
    // underglow
    const ug = ctx.createRadialGradient(50, 0, 0, 50, 0, 55);
    ug.addColorStop(0, 'rgba(255,43,214,.55)');
    ug.addColorStop(1, 'rgba(255,43,214,0)');
    ctx.fillStyle = ug;
    ctx.beginPath(); ctx.ellipse(50, 1, 55, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // body
    ctx.beginPath();
    ctx.moveTo(3, -9);
    ctx.lineTo(2, -19);
    ctx.quadraticCurveTo(2, -23, 7, -23.5);
    ctx.lineTo(27, -25);
    ctx.quadraticCurveTo(36, -36, 46, -37);
    ctx.lineTo(60, -36.5);
    ctx.quadraticCurveTo(67, -35, 76, -26);
    ctx.quadraticCurveTo(93, -24, 98, -20);
    ctx.quadraticCurveTo(101, -17, 100, -11);
    ctx.lineTo(99, -9);
    ctx.lineTo(88.5, -9);
    ctx.arc(78, -9, 10.5, 0, Math.PI, true);
    ctx.lineTo(30.5, -9);
    ctx.arc(20, -9, 10.5, 0, Math.PI, true);
    ctx.closePath();
    const bg = ctx.createLinearGradient(0, -37, 0, -9);
    bg.addColorStop(0, '#2c3150');
    bg.addColorStop(.5, '#141729');
    bg.addColorStop(1, '#07080f');
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = 'rgba(0,229,255,.55)';
    ctx.lineWidth = .5; ctx.stroke();

    // windows
    ctx.beginPath();
    ctx.moveTo(30, -25.6);
    ctx.quadraticCurveTo(37, -34.5, 46, -35.3);
    ctx.lineTo(59, -35);
    ctx.quadraticCurveTo(65, -33.8, 72, -26.6);
    ctx.closePath();
    const wg = ctx.createLinearGradient(30, -35, 72, -26);
    wg.addColorStop(0, '#0b1426');
    wg.addColorStop(.5, '#1c2a4a');
    wg.addColorStop(1, '#090f1d');
    ctx.fillStyle = wg; ctx.fill();
    ctx.fillStyle = '#141729';
    ctx.fillRect(51, -35.5, 1.6, 10);
    // sliding glass sheen
    const sh = ((t * 40) % 90) - 10;
    ctx.save(); ctx.clip();
    ctx.fillStyle = 'rgba(255,43,214,.18)';
    ctx.beginPath();
    ctx.moveTo(30 + sh, -36); ctx.lineTo(36 + sh, -36); ctx.lineTo(30 + sh, -25); ctx.lineTo(24 + sh, -25);
    ctx.fill();
    ctx.restore();

    // neon side strip, door line, handle
    ctx.save();
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(0,229,255,.9)'; ctx.lineWidth = .7;
    ctx.beginPath(); ctx.moveTo(10, -15); ctx.lineTo(92, -15.5); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = .4;
    ctx.beginPath(); ctx.moveTo(52, -25); ctx.lineTo(53, -11); ctx.stroke();
    ctx.fillStyle = '#3a4060'; ctx.fillRect(44, -21, 4, .9);

    // lights
    ctx.save();
    ctx.shadowColor = '#cfe9ff'; ctx.shadowBlur = 25;
    ctx.fillStyle = '#f2f8ff';
    ctx.beginPath(); ctx.ellipse(97.5, -18, 2.6, 1.3, -.2, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = '#ff1a40'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#ff2a4d';
    ctx.fillRect(1.6, -21.5, 2.4, 4.5);
    ctx.restore();

    // wheels
    const ang = (t * ROAD) / (8.5 * s);
    for (const cx of [20, 78]) {
      ctx.fillStyle = '#040508';
      ctx.beginPath(); ctx.arc(cx, -9, 8.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2d3245';
      ctx.beginPath(); ctx.arc(cx, -9, 5.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#7f88a8'; ctx.lineWidth = .9;
      for (let k = 0; k < 5; k++) {
        const a = ang + k * Math.PI * 2 / 5;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * 1.2, -9 + Math.sin(a) * 1.2);
        ctx.lineTo(cx + Math.cos(a) * 5, -9 + Math.sin(a) * 5);
        ctx.stroke();
      }
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath(); ctx.arc(cx, -9, 1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function rain(dt) {
    for (const d of drops) {
      if (running) {
        d.y += d.v * dt;
        d.x -= d.v * .22 * dt;
        if (d.y >= d.ty) {
          if (d.ty < H) splashes.push({ x: d.x, y: d.ty, r: 1, a: .55 });
          newDrop(d, false);
        }
      }
    }
    ctx.lineCap = 'round';
    for (const layerNear of [false, true]) {
      ctx.strokeStyle = layerNear ? 'rgba(190,210,255,.5)' : 'rgba(160,180,240,.28)';
      ctx.lineWidth = layerNear ? 1.4 : .8;
      ctx.beginPath();
      for (const d of drops) {
        if (d.near !== layerNear) continue;
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + .22 * d.l, d.y - d.l);
      }
      ctx.stroke();
    }
  }

  function drawSplashes(dt) {
    ctx.lineWidth = 1;
    splashes = splashes.filter(p => {
      if (running) { p.r += 34 * dt; p.a -= 1.7 * dt; p.x -= ROAD * dt; }
      if (p.a <= 0) return false;
      ctx.strokeStyle = `rgba(200,215,255,${p.a})`;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * .3, 0, 0, Math.PI * 2); ctx.stroke();
      return true;
    });
  }

  function lightning(dt) {
    if (running && t > nextFlash) {
      flash = 1;
      nextFlash = t + rand(9, 20);
      setTimeout(() => { flash = .8; }, 120);
    }
    if (flash > 0) {
      ctx.fillStyle = `rgba(190,200,255,${flash * .22})`;
      ctx.fillRect(0, 0, W, H);
      flash = Math.max(0, flash - dt * 3.5);
    }
  }

  // ---------- glowing title ----------
  let flickerUntil = 0;
  function title() {
    const text = 'COMMAND CENTER';
    const fs = Math.max(18, Math.min(W * .072, roadY * .2));
    const y = Math.max(fs * .9, roadY * .17);
    if (running && t > flickerUntil + 1 && Math.random() < .004) flickerUntil = t + rand(.15, .4);
    const flick = t < flickerUntil ? (Math.random() < .5 ? .3 : 1) : 1;
    const pulse = .85 + Math.sin(t * 2.2) * .15;

    ctx.save();
    ctx.font = `800 ${fs}px "Orbitron","Eurostile","Segoe UI","Helvetica Neue",Arial,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${fs * .14}px`;
    ctx.globalAlpha = flick;

    // magenta chromatic halo
    ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = fs * .9 * pulse;
    ctx.fillStyle = 'rgba(255,43,214,.55)';
    ctx.fillText(text, W / 2 + fs * .04, y + fs * .03);
    // cyan neon tube
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = fs * .7 * pulse;
    ctx.fillStyle = '#00e5ff';
    ctx.fillText(text, W / 2, y);
    ctx.shadowBlur = fs * .25;
    ctx.fillText(text, W / 2, y);
    // hot white core
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(235,255,255,.85)';
    ctx.fillText(text, W / 2, y);

    // hologram scanlines across the lettering
    ctx.globalAlpha = .18 * flick;
    ctx.fillStyle = '#04050d';
    const scan = (t * 30) % 6;
    for (let sy = y - fs * .6 + scan; sy < y + fs * .6; sy += 6) ctx.fillRect(W * .05, sy, W * .9, 1.5);
    ctx.restore();
  }

  function vignette() {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    if (running) t += dt;
    const step = running ? dt : 0;

    sky();
    drawLayer(far, t * 12);
    fog(roadY * .35, roadY, .35);
    drawLayer(near, t * 45);
    fog(roadY * .7, roadY, .2);
    title();
    streetlights(false);
    road();
    car();
    drawSplashes(step);
    rain(step);
    lightning(step);
    vignette();
    requestAnimationFrame(frame);
  }

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 150); });
  cv.addEventListener('click', () => { running = !running; });

  setup();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
