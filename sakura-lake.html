<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sakura Lake</title>
<style>
  html,body{margin:0;height:100%;background:#070818;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive scene: a cherry blossom tree grows under a full moon beside a reflective lake. Move to stir the falling petals, click to grow a new tree."></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = p => 1 - Math.pow(1 - p, 3);

  const PINKS = ['#ffb7d5', '#ff9ec7', '#ffc8e0', '#f78fb3', '#ffd6e8', '#ffaacf'];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, DPR, hz, moon;
  let stars = [], far = [], near = [], flies = [];
  let tree = null, treeCanvas = null;
  let petals = [], ripples = [];
  const mouse = { x: -9999, y: -9999, vx: 0, vy: 0, active: false };
  let t = 0, hintAlpha = 1;

  // ---------------- setup ----------------
  function setup() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    hz = Math.round(H * .7);
    moon = { x: W * .78, y: H * .2, r: Math.max(18, Math.min(W, H) * .065) };

    stars = Array.from({ length: Math.round(W * H / 5000) }, () => ({
      x: rand(0, W), y: rand(0, hz * .85), r: rand(.3, 1.4), ph: rand(0, 6.28), sp: rand(.6, 2)
    }));

    const ridge = (base, amp, seeds) => {
      const pts = [];
      for (let x = 0; x <= W + 8; x += 8) {
        let y = 0;
        seeds.forEach(([f, a, p]) => y += Math.sin(x * f + p) * a);
        pts.push([x, hz - base - y * amp]);
      }
      return pts;
    };
    const s = () => [[rand(.002, .004), 1, rand(0, 6)], [rand(.006, .01), .45, rand(0, 6)], [rand(.02, .03), .12, rand(0, 6)]];
    far = ridge(H * .14, H * .06, s());
    near = ridge(H * .06, H * .04, s());

    flies = Array.from({ length: 14 }, () => ({
      x: rand(0, W), y: rand(hz - H * .07, hz - 6), ph: rand(0, 6.28), sp: rand(.3, .8), r: rand(.7, 1.3)
    }));

    treeCanvas = document.createElement('canvas');
    treeCanvas.width = W * DPR; treeCanvas.height = H * DPR;
    growTree(reduced);
  }

  // ---------------- tree ----------------
  function growTree(instant) {
    const segs = [], blooms = [];
    const baseX = W * .5 + rand(-W * .08, W * .08);
    const baseY = hz - 2;
    const L0 = Math.min(H * .125, W * .1);
    const maxD = 8;

    function branch(x, y, a, len, w, d, t0) {
      const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
      const dur = .25 + (len / L0) * .45;
      segs.push({ x, y, x2, y2, w, t0, dur });
      const tEnd = t0 + dur;

      if (d >= 5 && Math.random() < .35) {
        blooms.push({ x: (x + x2) / 2 + rand(-6, 6), y: (y + y2) / 2 + rand(-6, 6), r: rand(2, 4.5), c: pick(PINKS), t0: tEnd + rand(0, .4) });
      }
      if (d >= maxD || len < 6) {
        for (let i = 0; i < 5; i++) {
          blooms.push({ x: x2 + rand(-11, 11), y: y2 + rand(-11, 9), r: rand(2.2, 5.5), c: pick(PINKS), t0: tEnd + rand(0, .7) });
        }
        return;
      }
      const kids = d === 0 ? 3 : (Math.random() < .25 ? 3 : 2);
      for (let k = 0; k < kids; k++) {
        let na = a + (k - (kids - 1) / 2) * rand(.5, .75) + rand(-.2, .2);
        na += (-Math.PI / 2 - na) * (d < 2 ? .1 : .02);
        branch(x2, y2, na, len * rand(.72, .84), Math.max(.8, w * .68), d + 1, tEnd - dur * .1);
      }
    }
    branch(baseX, baseY, -Math.PI / 2 + rand(-.08, .08), L0, Math.max(8, L0 * .12), 0, 0);

    let end = 0, cx = 0, cy = 0;
    blooms.forEach(b => { end = Math.max(end, b.t0 + .5); cx += b.x; cy += b.y; });
    cx /= blooms.length; cy /= blooms.length;
    let spread = 0;
    blooms.forEach(b => spread = Math.max(spread, Math.hypot(b.x - cx, b.y - cy)));

    tree = { segs, blooms, baseX, baseY, start: instant ? t - end - 1 : t, end, cx, cy, spread, cached: false };
  }

  function drawTree(c, now, full) {
    const age = full ? 1e9 : now - tree.start;
    const grow = clamp(age / tree.end, 0, 1);

    // soft canopy glow
    if (grow > .3) {
      const a = clamp((grow - .3) / .7, 0, 1) * .22;
      const g = c.createRadialGradient(tree.cx, tree.cy, 0, tree.cx, tree.cy, tree.spread * 1.15);
      g.addColorStop(0, `rgba(255,150,200,${a})`);
      g.addColorStop(1, 'rgba(255,150,200,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(tree.cx, tree.cy, tree.spread * 1.15, 0, Math.PI * 2); c.fill();
    }

    // little island mound
    c.fillStyle = '#120c1c';
    c.beginPath(); c.ellipse(tree.baseX, hz, Math.min(W * .12, 140), 10, 0, Math.PI, 0); c.fill();

    c.lineCap = 'round';
    for (const s of tree.segs) {
      const p = clamp((age - s.t0) / s.dur, 0, 1);
      if (p <= 0) continue;
      const e = ease(p);
      c.strokeStyle = '#2a1a2e';
      c.lineWidth = s.w;
      c.beginPath();
      c.moveTo(s.x, s.y);
      c.lineTo(s.x + (s.x2 - s.x) * e, s.y + (s.y2 - s.y) * e);
      c.stroke();
    }
    // moonlit rim on the trunk side facing the moon
    c.strokeStyle = 'rgba(255,220,235,.12)';
    for (const s of tree.segs) {
      if (s.w < 2.5) continue;
      const p = clamp((age - s.t0) / s.dur, 0, 1);
      if (p <= 0) continue;
      const e = ease(p);
      c.lineWidth = s.w * .25;
      c.beginPath();
      c.moveTo(s.x + s.w * .3, s.y);
      c.lineTo(s.x + s.w * .3 + (s.x2 - s.x) * e, s.y + (s.y2 - s.y) * e);
      c.stroke();
    }

    for (const b of tree.blooms) {
      const p = clamp((age - b.t0) / .5, 0, 1);
      if (p <= 0) continue;
      c.globalAlpha = .82;
      c.fillStyle = b.c;
      c.beginPath(); c.arc(b.x, b.y, b.r * ease(p), 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
  }

  // ---------------- petals ----------------
  function spawnPetal() {
    const b = pick(tree.blooms);
    petals.push({
      x: b.x, y: b.y, vx: rand(-10, 10), vy: rand(5, 20),
      rot: rand(0, 6.28), vr: rand(-3, 3), flip: rand(0, 6.28), vf: rand(2, 5),
      s: rand(.7, 1.3), c: pick(PINKS), ph: rand(0, 6.28),
      land: rand(hz + 4, hz + (H - hz) * .9)
    });
  }

  function updatePetals(dt) {
    const wind = y => 22 + 18 * Math.sin(t * .3) + 12 * Math.sin(y * .012 + t * .8);
    for (const p of petals) {
      p.vx += (wind(p.y) - p.vx) * dt * 1.1;
      p.vy += (38 * p.s - p.vy) * dt * 1.4;
      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d = Math.hypot(dx, dy);
        const R = 150;
        if (d < R && d > .01) {
          const f = (1 - d / R) ** 2;
          p.vx += (dx / d * 160 - dy / d * 260) * f * dt * 3;
          p.vy += (dy / d * 160 + dx / d * 260) * f * dt * 3;
          p.vx += mouse.vx * f * .04;
          p.vy += mouse.vy * f * .04;
          p.vr += f * dt * 8;
        }
      }
      p.x += (p.vx + Math.sin(t * 2.6 + p.ph) * 14) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.flip += p.vf * dt;
      if (p.x > W + 30) p.x = -30;
      if (p.x < -40) p.x = W + 20;
      if (p.y >= p.land) {
        ripples.push({ x: p.x, y: p.land, r: 1, a: .55 });
        p.dead = true;
      }
    }
    petals = petals.filter(p => !p.dead);
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(p.s, p.s * (.35 + .65 * Math.abs(Math.cos(p.flip))));
    ctx.fillStyle = p.c;
    ctx.globalAlpha = .9;
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.bezierCurveTo(4.5, -4, 4.5, 3, 0, 5);
    ctx.bezierCurveTo(-4.5, 3, -4.5, -4, 0, -5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(-1, -1, 1.2, 2.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------------- scene ----------------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#060716');
    g.addColorStop(.55, '#17113a');
    g.addColorStop(1, '#4b2452');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz);

    for (const s of stars) {
      const a = .35 + .65 * (.5 + .5 * Math.sin(t * s.sp + s.ph));
      ctx.fillStyle = `rgba(255,255,255,${a * .8})`;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }

    const mg = ctx.createRadialGradient(moon.x, moon.y, moon.r * .8, moon.x, moon.y, moon.r * 5);
    mg.addColorStop(0, 'rgba(255,230,240,.28)');
    mg.addColorStop(1, 'rgba(255,230,240,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r * 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff4e6';
    ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(220,200,200,.35)';
    [[-.3, -.2, .18], [.25, .15, .13], [.05, .4, .09], [-.1, .1, .07]].forEach(([dx, dy, r]) => {
      ctx.beginPath(); ctx.arc(moon.x + dx * moon.r, moon.y + dy * moon.r, r * moon.r, 0, Math.PI * 2); ctx.fill();
    });
  }

  function drawRidge(pts, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, hz);
    pts.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(W, hz);
    ctx.closePath(); ctx.fill();
  }

  function drawMist() {
    const g = ctx.createLinearGradient(0, hz - H * .12, 0, hz);
    g.addColorStop(0, 'rgba(120,80,150,0)');
    g.addColorStop(1, 'rgba(120,80,150,.35)');
    ctx.fillStyle = g; ctx.fillRect(0, hz - H * .12, W, H * .12);
  }

  function drawFlies() {
    for (const f of flies) {
      const x = f.x + Math.sin(t * f.sp + f.ph) * 30;
      const y = f.y + Math.cos(t * f.sp * 1.3 + f.ph) * 12;
      const a = .4 + .6 * Math.max(0, Math.sin(t * 1.7 + f.ph * 3));
      const g = ctx.createRadialGradient(x, y, 0, x, y, f.r * 6);
      g.addColorStop(0, `rgba(230,255,170,${a})`);
      g.addColorStop(1, 'rgba(230,255,170,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, f.r * 6, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawLake() {
    ctx.fillStyle = '#0a0a1c';
    ctx.fillRect(0, hz, W, H - hz);
    const step = 2;
    for (let y = hz; y < H; y += step) {
      const depth = (y - hz) / (H - hz);
      const srcY = hz - (y - hz) - step;
      if (srcY < 0) break;
      const off = Math.sin(y * .09 + t * 2.2) * (1 + depth * 6) + Math.sin(y * .23 - t * 3.1) * depth * 2;
      ctx.drawImage(cv, 0, srcY * DPR, W * DPR, step * DPR, off, y, W, step);
    }
    const tint = ctx.createLinearGradient(0, hz, 0, H);
    tint.addColorStop(0, 'rgba(10,8,30,.35)');
    tint.addColorStop(1, 'rgba(6,5,18,.8)');
    ctx.fillStyle = tint; ctx.fillRect(0, hz, W, H - hz);

    // shimmering moon path
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 26; i++) {
      const y = hz + 6 + i * ((H - hz) / 26);
      const w = (8 + i * 2.4) * (.5 + .5 * Math.sin(t * 3 + i * 1.7));
      ctx.fillStyle = `rgba(255,225,235,${.16 - i * .004})`;
      ctx.fillRect(moon.x - w / 2 + Math.sin(t * 1.5 + i) * 4, y, w, 1.5);
    }
    ctx.restore();

    ctx.fillStyle = 'rgba(255,200,230,.08)';
    ctx.fillRect(0, hz, W, 1);
  }

  function drawRipples(dt) {
    ctx.lineWidth = 1;
    ripples = ripples.filter(r => {
      r.r += 16 * dt; r.a -= .45 * dt;
      if (r.a <= 0) return false;
      ctx.strokeStyle = `rgba(255,190,225,${r.a})`;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .26, 0, 0, Math.PI * 2); ctx.stroke();
      if (r.r > 6) {
        ctx.strokeStyle = `rgba(255,190,225,${r.a * .5})`;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * .55, r.r * .14, 0, 0, Math.PI * 2); ctx.stroke();
      }
      return true;
    });
  }

  function drawCursor() {
    if (!mouse.active) return;
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 70);
    g.addColorStop(0, 'rgba(255,190,225,.16)');
    g.addColorStop(1, 'rgba(255,190,225,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 70, 0, Math.PI * 2); ctx.fill();
  }

  function drawHint(dt) {
    if (t > 6) hintAlpha = Math.max(0, hintAlpha - dt * .5);
    if (hintAlpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = hintAlpha * .75;
    ctx.fillStyle = '#ffd6e8';
    ctx.font = `500 ${Math.max(11, Math.min(15, W / 70))}px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('桜  ·  move to stir the petals  ·  click to grow a new tree', W / 2, H - 22);
    ctx.restore();
  }

  // ---------------- loop ----------------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    t += dt;

    drawSky();
    drawRidge(far, '#2a2152');
    drawMist();
    drawRidge(near, '#18122f');
    drawFlies();

    const grown = t - tree.start > tree.end;
    if (grown && !tree.cached) {
      const tc = treeCanvas.getContext('2d');
      tc.setTransform(DPR, 0, 0, DPR, 0, 0);
      tc.clearRect(0, 0, W, H);
      drawTree(tc, t, true);
      tree.cached = true;
    }
    if (tree.cached) ctx.drawImage(treeCanvas, 0, 0, W, H);
    else drawTree(ctx, t, false);

    drawLake();
    drawRipples(dt);

    const bloomed = t - tree.start > tree.end * .55;
    if (bloomed) {
      const rate = reduced ? 4 : 34;
      if (petals.length < 380 && Math.random() < rate * dt) spawnPetal();
      if (petals.length < 380 && Math.random() < rate * dt) spawnPetal();
    }
    updatePetals(dt);
    petals.forEach(drawPetal);

    drawCursor();
    drawHint(dt);

    mouse.vx *= .85; mouse.vy *= .85;
    requestAnimationFrame(frame);
  }

  // ---------------- input ----------------
  function move(x, y) {
    if (mouse.active) { mouse.vx = (x - mouse.x) * 6; mouse.vy = (y - mouse.y) * 6; }
    mouse.x = x; mouse.y = y; mouse.active = true;
  }
  cv.addEventListener('pointermove', e => move(e.clientX, e.clientY));
  cv.addEventListener('pointerleave', () => { mouse.active = false; });
  cv.addEventListener('click', () => {
    // send current blossoms flying, then regrow
    if (tree) for (let i = 0; i < 60; i++) {
      spawnPetal();
      const p = petals[petals.length - 1];
      p.vx = rand(-120, 120); p.vy = rand(-120, 20);
    }
    growTree(false);
  });

  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { petals = []; ripples = []; setup(); }, 150); });

  setup();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
