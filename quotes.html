<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Fuel</title>
<style>
  :root{
    --bg:#07081a; --ink:#eef0ff; --muted:#9aa0c8; --line:rgba(255,255,255,.1);
    --accent:#00e5ff; --glass:rgba(16,18,42,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}

  .aurora{position:fixed;inset:-20%;z-index:0;filter:blur(60px);opacity:.55;pointer-events:none}
  .aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;transition:background 1.2s}
  .aurora i:nth-child(1){width:45vw;height:45vw;left:10%;top:15%;background:var(--accent);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
  .aurora i:nth-child(2){width:38vw;height:38vw;right:8%;bottom:10%;background:#7c4dff;opacity:.35;animation:drift 22s ease-in-out infinite alternate-reverse}
  @keyframes drift{to{transform:translate(8vw,-6vh) scale(1.15)}}

  main{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{position:relative;width:min(760px,100%);max-height:100%;padding:clamp(18px,4vw,40px) clamp(18px,5vw,48px) clamp(14px,3vw,26px);
    background:var(--glass);border:1px solid var(--line);border-radius:22px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 20px 60px rgba(0,0,0,.45),0 0 40px -10px var(--accent);
    transition:box-shadow 1s;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.9}

  .kanji{position:absolute;right:clamp(10px,3vw,28px);bottom:-.15em;font-size:clamp(90px,22vw,200px);line-height:1;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;color:var(--accent);opacity:.07;
    pointer-events:none;transition:color 1s,opacity .5s;user-select:none}

  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:clamp(10px,2.5vh,22px)}
  .label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;transition:color 1s}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:background 1s,box-shadow 1s}
  .count{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  blockquote{margin:0;position:relative;flex:1;min-height:0;overflow:auto}
  .q{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:clamp(18px,3.4vw,32px);line-height:1.35;
    margin:0;text-wrap:balance;min-height:2.7em}
  .q .caret{display:inline-block;width:2px;height:.95em;background:var(--accent);margin-left:3px;vertical-align:-.1em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .who{margin-top:clamp(8px,2vh,16px);font-size:clamp(13px,1.6vw,15px);color:var(--muted);opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
  .who.show{opacity:1;transform:none}
  .who b{color:var(--ink);font-weight:600}

  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:clamp(12px,3vh,26px);position:relative}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  button{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:12px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
  button:hover{background:rgba(255,255,255,.1)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
  .actions{margin-left:auto;display:flex;gap:6px}
  .primary{background:var(--accent);color:#06071a;border-color:transparent;font-weight:700;transition:background 1s}
  .primary:hover{background:var(--accent);filter:brightness(1.1)}
  .toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

  .progress{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0;opacity:.7}
  .toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;z-index:2;
    background:rgba(20,22,48,.9);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;transition:.3s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-height:340px){.top{margin-bottom:6px}.bar{margin-top:8px}.chips{display:none}}
  @media (max-width:520px){.chips{order:2;width:100%}.actions{margin-left:0}}
  @media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i></div>
<canvas id="bg" aria-hidden="true"></canvas>

<main>
  <article class="card" id="card" title="Click for another quote">
    <div class="kanji" id="kanji" aria-hidden="true">道</div>
    <div class="top">
      <span class="dot"></span>
      <span class="label" id="label">Quote of the day</span>
      <span class="count" id="count"></span>
    </div>
    <blockquote aria-live="polite">
      <p class="q" id="q"></p>
      <div class="who" id="who"></div>
    </blockquote>
    <div class="bar" id="bar">
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
      <div class="actions">
        <button class="toggle" id="auto" aria-pressed="false" title="Rotate every 20 seconds">⟳ Auto</button>
        <button id="copy" title="Copy quote">Copy</button>
        <button class="primary" id="next" title="Next quote (Space)">Next →</button>
      </div>
    </div>
    <div class="progress" id="progress"></div>
  </article>
</main>
<div class="toast" id="toast" role="status">Copied</div>

<script>
(() => {
  const CATS = {
    anime:   { name: 'Anime',   color: '#ff4fd8', kanji: '魂' },
    tech:    { name: 'Code',    color: '#00e5ff', kanji: '電' },
    nature:  { name: 'Nature',  color: '#4dff9a', kanji: '森' },
    mindset: { name: 'Mindset', color: '#ffb84d', kanji: '道' }
  };

  const QUOTES = [
    ['anime', 'A dropout will beat a genius through hard work.', 'Rock Lee', 'Naruto'],
    ['anime', "Hard work is worthless for those that don't believe in themselves.", 'Naruto Uzumaki', 'Naruto'],
    ['anime', "If you don't like your destiny, don't accept it.", 'Naruto Uzumaki', 'Naruto'],
    ['anime', "If you don't take risks, you can't create a future.", 'Monkey D. Luffy', 'One Piece'],
    ['anime', "Whatever you lose, you'll find it again. But what you throw away you'll never get back.", 'Kenshin Himura', 'Rurouni Kenshin'],
    ['anime', 'A lesson without pain is meaningless. That\'s because no one can gain without sacrificing something.', 'Edward Elric', 'Fullmetal Alchemist: Brotherhood'],
    ['anime', 'Power comes in response to a need, not a desire.', 'Goku', 'Dragon Ball Z'],
    ['anime', 'Fear is not evil. It tells you what your weakness is.', 'Gildarts Clive', 'Fairy Tail'],
    ['anime', "If you win, you live. If you lose, you die. If you don't fight, you can't win!", 'Eren Yeager', 'Attack on Titan'],

    ['tech', 'First, solve the problem. Then, write the code.', 'John Johnson'],
    ['tech', 'Talk is cheap. Show me the code.', 'Linus Torvalds'],
    ['tech', 'Any fool can write code that a computer can understand. Good programmers write code that humans can understand.', 'Martin Fowler'],
    ['tech', 'The best way to predict the future is to invent it.', 'Alan Kay'],
    ['tech', 'Make it work, make it right, make it fast.', 'Kent Beck'],
    ['tech', 'Simplicity is prerequisite for reliability.', 'Edsger W. Dijkstra'],
    ['tech', 'Programs must be written for people to read, and only incidentally for machines to execute.', 'Harold Abelson'],
    ['tech', "Without data, you're just another person with an opinion.", 'W. Edwards Deming'],
    ['tech', 'Stay hungry. Stay foolish.', 'Steve Jobs'],

    ['nature', 'Adopt the pace of nature: her secret is patience.', 'Ralph Waldo Emerson'],
    ['nature', 'In every walk with nature one receives far more than he seeks.', 'John Muir'],
    ['nature', 'The mountains are calling and I must go.', 'John Muir'],
    ['nature', 'Nature does not hurry, yet everything is accomplished.', 'Lao Tzu'],
    ['nature', 'Look deep into nature, and then you will understand everything better.', 'Albert Einstein'],
    ['nature', 'The bamboo that bends is stronger than the oak that resists.', 'Japanese proverb'],

    ['mindset', 'Fall seven times, stand up eight.', 'Japanese proverb'],
    ['mindset', 'We are what we repeatedly do. Excellence, then, is not an act, but a habit.', 'Will Durant'],
    ['mindset', 'It does not matter how slowly you go as long as you do not stop.', 'Confucius'],
    ['mindset', 'The man who moves a mountain begins by carrying away small stones.', 'Confucius'],
    ['mindset', "It always seems impossible until it's done.", 'Nelson Mandela'],
    ['mindset', "You don't have to be great to start, but you have to start to be great.", 'Zig Ziglar'],
    ['mindset', 'Hard choices, easy life. Easy choices, hard life.', 'Jerzy Gregorek'],
    ['mindset', 'Small daily improvements over time lead to stunning results.', 'Robin Sharma']
  ].map(([cat, text, who, src], id) => ({ id, cat, text, who, src }));

  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('dailyfuel:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('dailyfuel:' + k, JSON.stringify(v)); } catch {} }
  };

  let active = new Set(store.get('cats', Object.keys(CATS)));
  if (!active.size) active = new Set(Object.keys(CATS));
  let bag = [], current = null, typing = null;

  // ---------- category chips ----------
  for (const [key, c] of Object.entries(CATS)) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c.name;
    b.style.setProperty('--c', c.color);
    b.setAttribute('aria-pressed', active.has(key));
    b.addEventListener('click', e => {
      e.stopPropagation();
      if (active.has(key) && active.size === 1) return;
      active.has(key) ? active.delete(key) : active.add(key);
      b.setAttribute('aria-pressed', active.has(key));
      store.set('cats', [...active]);
      bag = [];
      if (!active.has(current.cat)) next();
    });
    $('chips').appendChild(b);
  }

  // ---------- picking ----------
  function refill() {
    bag = QUOTES.filter(q => active.has(q.cat) && (!current || q.id !== current.id));
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  function next() {
    if (!bag.length) refill();
    show(bag.pop(), 'Fresh fuel');
  }
  function quoteOfTheDay() {
    const d = new Date();
    const seed = d.getFullYear() * 1000 + Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
    const pool = QUOTES.filter(q => active.has(q.cat));
    return pool[(seed * 2654435761 >>> 0) % pool.length];
  }

  // ---------- showing ----------
  function show(q, label) {
    current = q;
    const c = CATS[q.cat];
    root.style.setProperty('--accent', c.color);
    $('label').textContent = `${label} · ${c.name}`;
    $('kanji').textContent = c.kanji;
    const seen = store.get('seen', []);
    if (!seen.includes(q.id)) { seen.push(q.id); store.set('seen', seen); }
    $('count').textContent = `${seen.length}/${QUOTES.length} discovered`;

    const who = $('who');
    who.classList.remove('show');
    who.innerHTML = '';
    const b = document.createElement('b'); b.textContent = '— ' + q.who;
    who.appendChild(b);
    if (q.src) who.append(', ' + q.src);

    clearTimeout(typing);
    const el = $('q');
    if (reduced) { el.textContent = `“${q.text}”`; who.classList.add('show'); return; }
    const full = `“${q.text}”`;
    let i = 0;
    const caret = '<span class="caret"></span>';
    const step = () => {
      i = Math.min(full.length, i + (full.length > 90 ? 2 : 1));
      el.textContent = full.slice(0, i);
      el.insertAdjacentHTML('beforeend', caret);
      if (i < full.length) typing = setTimeout(step, 22);
      else typing = setTimeout(() => { el.textContent = full; who.classList.add('show'); }, 350);
    };
    step();
    burst(c.color);
  }

  // ---------- controls ----------
  const go = () => { next(); restartAuto(); };
  $('card').addEventListener('click', e => { if (!e.target.closest('button')) go(); });
  $('next').addEventListener('click', e => { e.stopPropagation(); go(); });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === 'ArrowRight') { e.preventDefault(); go(); }
  });

  $('copy').addEventListener('click', async e => {
    e.stopPropagation();
    const text = `“${current.text}” — ${current.who}${current.src ? ', ' + current.src : ''}`;
    try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
    catch { toast('Copy not allowed here'); }
  });
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1400);
  }

  // auto-rotate
  const AUTO_MS = 20000;
  let auto = store.get('auto', false), autoStart = 0;
  function setAuto(on) {
    auto = on; store.set('auto', on);
    $('auto').setAttribute('aria-pressed', on);
    restartAuto();
  }
  function restartAuto() { autoStart = performance.now(); }
  $('auto').addEventListener('click', e => { e.stopPropagation(); setAuto(!auto); });

  // ---------- background: drifting motes ----------
  const cv = $('bg'), ctx = cv.getContext('2d');
  let W, H, DPR, motes = [], sparks = [];
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    motes = Array.from({ length: Math.round(W * H / 9000) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .3,
      vy: -(Math.random() * 12 + 4), ph: Math.random() * 6.28
    }));
  }
  function burst(color) {
    if (reduced) return;
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
      sparks.push({ x: W / 2, y: H / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
    }
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, W, H);
    const accent = getComputedStyle(root).getPropertyValue('--accent').trim();
    for (const m of motes) {
      if (!reduced) {
        m.y += m.vy * dt; m.x += Math.sin(now / 1500 + m.ph) * 6 * dt;
        if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
      }
      ctx.globalAlpha = .25 + .35 * (.5 + .5 * Math.sin(now / 900 + m.ph));
      ctx.fillStyle = m.r > 1.3 ? accent : '#ffffff';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
    }
    sparks = sparks.filter(s => {
      s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .96; s.vy *= .96; s.life -= dt * 1.2;
      if (s.life <= 0) return false;
      ctx.globalAlpha = s.life * .8; ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.8, 0, 6.283); ctx.fill();
      return true;
    });
    ctx.globalAlpha = 1;

    const p = $('progress');
    if (auto) {
      const f = (now - autoStart) / AUTO_MS;
      p.style.width = Math.min(100, f * 100) + '%';
      if (f >= 1) { next(); restartAuto(); }
    } else p.style.width = '0';
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);

  // ---------- start ----------
  resize();
  $('auto').setAttribute('aria-pressed', auto);
  show(quoteOfTheDay(), 'Quote of the day');
  restartAuto();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
